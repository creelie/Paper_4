name: release

# Run by hand from the Actions tab after the pull request is merged. It runs the supplementary
# gamma-matrix checks, then publishes a GitHub release with the Hexagon v4 package in
# hexagon-v4/ and the notes in .github/RELEASE_NOTES.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.2.0"
        required: true
        default: "v2.2.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "Hexagon v4 package of Residual-dimension obstructions for null-projected supersymmetric Yang-Mills theories"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Supplementary gamma-matrix checks
        run: |
          python -m pip install -r verification/code/requirements.txt
          python scripts/verify.py
          python verification/code/transfer_check.py
          python verification/code/contraction_check.py
          python verification/code/residual_two_check.py
          python verification/code/mixed_check.py

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the package files
        run: |
          for f in hexagon-v4/NullProjectedSYM_v4.pdf \
                   hexagon-v4/NullProjectedSYM_v4-tex.zip \
                   hexagon-v4/NullProjectedSYM_v4-arxiv.tar.gz \
                   hexagon-v4/HEXAGON_FORM.md \
                   hexagon-v4/AI_PROVENANCE.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" hexagon-v4/NullProjectedSYM_v4* hexagon-v4/HEXAGON_FORM.md hexagon-v4/AI_PROVENANCE.md \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
